name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # Integration tests use Testcontainers against real PostgreSQL, so they
      # need a Docker daemon. ubuntu-latest runners have one; windows-latest
      # cannot run Linux containers. This is why tests run on Linux only.
      - run: dotnet test --no-build -c Release --verbosity normal

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web lint
        working-directory: web
        run: npm run lint

      - name: Web typecheck + build
        working-directory: web
        run: npm run build

  publish:
    name: publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The SPA must be built BEFORE dotnet publish. Vite writes into
      # src/HospitalPm.Api/wwwroot, and the SDK collects that directory as
      # static web assets during publish. Reverse the order and you ship a
      # binary with an empty UI that still passes the health check.
      - name: Build SPA into wwwroot
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify SPA landed in wwwroot
        shell: bash
        run: |
          test -f src/HospitalPm.Api/wwwroot/index.html             || { echo "::error::SPA build did not produce wwwroot/index.html"; exit 1; }

      # Each RID is published on its own native OS rather than cross-published
      # from Linux. Cross-publishing works, but it hides Windows-specific
      # breakage until much later — which is exactly the failure this matrix
      # exists to prevent.
      - name: Publish
        run: >
          dotnet publish src/HospitalPm.Api
          -c Release
          -r ${{ matrix.rid }}
          -o artifacts/${{ matrix.rid }}

      # A binary that builds but will not start is not a passing build.
      # Both smoke tests boot the published artifact and require a 200 from
      # /health before the job is allowed to succeed.
      # Deliberately launched from the repo root, NOT from the artifact
      # directory. A Windows Service starts with CWD=C:\Windows\System32 and a
      # systemd unit uses its own WorkingDirectory, so running from the
      # artifact dir would only prove the app works in a layout production
      # never uses.
      #
      # /health alone is NOT sufficient: it answers 200 even when wwwroot
      # cannot be resolved, which once let a build ship with no UI at all.
      # The SPA assertion below is the part that actually catches that.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x artifacts/${{ matrix.rid }}/hospitalpm
          ASPNETCORE_URLS=http://127.0.0.1:5199 ./artifacts/${{ matrix.rid }}/hospitalpm &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS -m 2 http://127.0.0.1:5199/health >/dev/null; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" != "1" ]; then
            kill $PID 2>/dev/null || true
            echo "::error::health check failed"; exit 1
          fi
          echo "health: ok"

          BODY=$(curl -fsS -m 5 http://127.0.0.1:5199/ || true)
          kill $PID 2>/dev/null || true
          case "$BODY" in
            *"<script"*) echo "SPA served: ok" ;;
            *) echo "::error::SPA not served from / - wwwroot did not resolve"; exit 1 ;;
          esac

      # See the Linux step above for why this runs from the repo root and why
      # /health on its own is not a sufficient assertion.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ASPNETCORE_URLS = "http://127.0.0.1:5199"
          $p = Start-Process -PassThru -FilePath "artifacts/${{ matrix.rid }}/hospitalpm.exe"
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:5199/health" -TimeoutSec 2 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Write-Output "::error::health check failed"; exit 1
          }
          Write-Output "health: ok"

          $spaOk = $false
          try {
            $spa = Invoke-WebRequest -Uri "http://127.0.0.1:5199/" -TimeoutSec 5 -UseBasicParsing
            if ($spa.StatusCode -eq 200 -and $spa.Content -match '<script') { $spaOk = $true }
          } catch { }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $spaOk) {
            Write-Output "::error::SPA not served from / - wwwroot did not resolve"; exit 1
          }
          Write-Output "SPA served: ok"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hospitalpm-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/
          retention-days: 14
