# Hospital PM — Docker Compose (Linux target)
#
# The Linux counterpart of the Windows Inno Setup installer. Stands up the
# application and its PostgreSQL database with one command:
#
#   docker compose up -d
#
# Data survives container removal: the database cluster and the application's
# data directory are on named volumes.
#
# Access the UI at http://localhost:5000/ after startup.
#
# Before the first run, set the hospital's name - the Windows installer asks for
# it, and this is the same question. It is printed at the top of every PM
# certificate and service report, so a hospital never gets one headed with the
# product's name. Put it in an .env file beside this one:
#
#   HOSPITAL_NAME=Sunrise Multispecialty Hospital
#
# or pass it on the command line: HOSPITAL_NAME="..." docker compose up -d
#
# First run: the application auto-runs migrations and presents a setup page for
# the administrator account, as the Windows installer does.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Port 5433 on the host, not 5432 — identical to the Windows installer,
    # which uses a non-standard port so an existing PostgreSQL keeps working.
    # Inside the compose network the container listens on 5432 as normal.
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: hospitalpm
      POSTGRES_USER: hospitalpm
      # Change this. The Windows installer generates a random password; the
      # compose file cannot, so a default is provided. Set a real one in
      # an .env file or with POSTGRES_PASSWORD=... on the command line.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospitalpm_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitalpm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      ConnectionStrings__HospitalPm: "Host=postgres;Port=5432;Database=hospitalpm;Username=hospitalpm;Password=${POSTGRES_PASSWORD:-hospitalpm_change_me}"
      ASPNETCORE_URLS: "http://+:5000"
      HOSPITALPM_DATA: /var/lib/hospitalpm
      # Required, and compose stops with this message if it is missing rather
      # than starting an install whose reports carry no hospital name.
      Reports__HospitalName: ${HOSPITAL_NAME:?Set HOSPITAL_NAME to the hospital's name, e.g. in an .env file. It is printed on every report.}
      # Disable mDNS inside a container — the host network is not available
      # in bridge mode, and multicast does not cross the Docker bridge.
      Mdns__Enabled: "false"
      # Parts of the product that are switched off for everyone unless set to true here or in
      # a .env file. The nightly backup runs regardless; Backups is the page, the run-now
      # button and restoring from one.
      Features__Import: ${FEATURE_IMPORT:-false}
      Features__Export: ${FEATURE_EXPORT:-false}
      Features__Backups: ${FEATURE_BACKUPS:-false}
      Features__Updates: ${FEATURE_UPDATES:-false}
    volumes:
      - appdata:/var/lib/hospitalpm
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

# The names, and the two host ports above, can be overridden so that a second
# copy can run beside a real one without touching its data. The container smoke
# test in CI (tools/container-smoke-test.sh) does exactly that. Left alone, they
# are the names and ports described at the top of this file.
volumes:
  pgdata:
    name: ${PGDATA_VOLUME:-hospitalpm-pgdata}
  appdata:
    name: ${APPDATA_VOLUME:-hospitalpm-appdata}

networks:
  internal:
    name: ${NETWORK_NAME:-hospitalpm}
