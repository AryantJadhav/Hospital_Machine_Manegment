# The database: PostgreSQL 18 with the "hospitalpm" database and user already made (the :DB image).
#
# One replica. Data is on a volume that outlives the pod. The password is NOT in this file: it comes from the
# Secret "hospitalpm-db" (see README.md), so the same password is never in two installs.
apiVersion: v1
kind: Service
metadata:
  name: hospitalpm-db
  namespace: hospitalpm
spec:
  clusterIP: None            # reached by name from inside the cluster only
  selector:
    app: hospitalpm-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hospitalpm-db
  namespace: hospitalpm
spec:
  serviceName: hospitalpm-db
  replicas: 1
  selector:
    matchLabels:
      app: hospitalpm-db
  template:
    metadata:
      labels:
        app: hospitalpm-db
    spec:
      containers:
        - name: postgres
          image: aryant050/hospitalpm:DB
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospitalpm-db
                  key: password
          volumeMounts:
            # PostgreSQL 18 keeps its data in a version-numbered folder under here, so the volume is mounted
            # here and not at .../data.
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U hospitalpm -d hospitalpm"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U hospitalpm -d hospitalpm"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
